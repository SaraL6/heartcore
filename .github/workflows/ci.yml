name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  database:
    name: Database access rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Load the schema twice (it must be safe to re-run) and check the rules
        run: >
          psql -v ON_ERROR_STOP=1 -q
          -f supabase/tests/stubs.sql
          -f supabase/schema.sql
          -f supabase/schema.sql
          -f supabase/tests/rules.test.sql
